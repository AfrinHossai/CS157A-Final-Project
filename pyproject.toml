[project]
name = "cs157a-final-project"
version = "0.1.0"
description = "CS 157A final project"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "flask-login>=0.6.3",
    "mysql-connector-python",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
